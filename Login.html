<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login — Task Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

  <div class="ledger-lines" aria-hidden="true"></div>

  <main class="login-stage">
    <div class="badge-card" id="badgeCard">
      <div class="badge-tab"></div>

      <header class="badge-head">
        <span class="badge-eyebrow">ACCESS CARD</span>
        <h1 class="badge-title">Task<br>Management</h1>
        <p class="badge-sub">pk, auto_increment — admin only</p>
      </header>

      <form id="loginForm" class="badge-form" autocomplete="off">
        <label class="field">
          <span class="field-label">Username</span>
          <input type="text" name="username" id="username" required autofocus>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" name="password" id="password" required>
        </label>

        <p class="field-error" id="loginError" hidden></p>

        <button type="submit" class="btn-brass" id="loginBtn">
          <span>Sign in</span>
        </button>
      </form>

      <div class="stamp-wrap" id="stampWrap" aria-hidden="true">
        <div class="stamp" id="stamp">ACCESS<br>GRANTED</div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const stampWrap = document.getElementById('stampWrap');
    const stamp = document.getElementById('stamp');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      btn.disabled = true;
      btn.classList.add('is-loading');

      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch("{{ url_for('login') }}", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.ok) {
          stampWrap.classList.add('is-visible');
          stamp.classList.add('is-stamped');
          setTimeout(() => { window.location.href = data.redirect; }, 950);
        } else {
          errorEl.textContent = data.error || 'Invalid username or password';
          errorEl.hidden = false;
          document.getElementById('badgeCard').classList.add('is-shaking');
          setTimeout(() => document.getElementById('badgeCard').classList.remove('is-shaking'), 400);
          btn.disabled = false;
          btn.classList.remove('is-loading');
        }
      } catch (err) {
        errorEl.textContent = 'Could not reach the server. Is Flask running?';
        errorEl.hidden = false;
        btn.disabled = false;
        btn.classList.remove('is-loading');
      }
    });
  </script>
</body>
</html>
